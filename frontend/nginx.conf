server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A whole chain is thousands of JSON rows; gzip earns its keep here.
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Same origin for the SPA and the API, so there is no CORS config anywhere
    # and no base URL to configure in the client.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An initial chain fetch can be slow while the backend solves IV.
        proxy_read_timeout 120s;
    }

    # FastAPI's own docs, handy from the same hostname.
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths are routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
