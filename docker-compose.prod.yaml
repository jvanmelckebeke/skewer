# Production: the images CI pushes from main, no source mounts, no host port
# for the backend. Don't run it beside docker-compose.yaml; both claim the
# skewer project name and the Traefik router.
#
#   docker compose -f docker-compose.prod.yaml pull
#   docker compose -f docker-compose.prod.yaml up -d
name: skewer

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skewer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-skewer}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-skewer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Runs `alembic upgrade head` before uvicorn on every start.
  backend:
    image: ghcr.io/jvanmelckebeke/skewer-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-skewer}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-skewer}
      BASE_POLL_MINUTES: ${BASE_POLL_MINUTES:-5}
      EOD_SNAPSHOT_CRON: ${EOD_SNAPSHOT_CRON:-10 21 * * 1-5}
      RISK_FREE_RATE: ${RISK_FREE_RATE:-0.04}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      IBKR_SVC_URL: ${IBKR_SVC_URL:-http://ibkr-svc:8000}
      EURONEXT_AUTH_KEY: ${EURONEXT_AUTH_KEY:-}
    networks:
      - default
      - ibkr
    depends_on:
      db:
        condition: service_healthy

  # nginx proxies /api to the service named `backend`, so keep that name.
  frontend:
    image: ghcr.io/jvanmelckebeke/skewer-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.skewer.entrypoints=web"
      - "traefik.http.routers.skewer.rule=Host(`skewer.desktop.lan`)"
      - "traefik.http.routers.skewer-tls.rule=Host(`skewer.desktop.jarivm.be`)"
      - "traefik.http.routers.skewer-tls.entrypoints=websecure"
      - "traefik.http.routers.skewer-tls.tls=true"
      - "traefik.http.services.skewer.loadbalancer.server.port=80"

volumes:
  pgdata:

networks:
  ibkr:
    external: true
